<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAMeC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12141c;
    --bg-glow: #1a1d2b; 
    --panel-white: #ffffff;
    --accent: #43F1F7;
    --text-primary: #f5f6fa;
    --text-muted: #8a8fa3;
    --border: #000000;
  } 

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 15%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px;
    z-index: 10;
  }

  .menu-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .menu-btn:hover {
    border-color: var(--accent);
    background: rgba(110, 231, 216, 0.06);
  }

  .menu-btn .bars {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .menu-btn .bars span {
    width: 14px;
    height: 2px;
    background: var(--text-primary);
    border-radius: 2px;
  }

  .enter-btn {
    background: var(--accent);
    border: none;
    color: #0b1420;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.03em;
    padding: 12px 28px;
    border-radius: 8px;
    cursor: pointer;
    text-decoration: none;
    transition: filter 0.2s ease, transform 0.15s ease;
  }

  .enter-btn:hover {
    filter: brightness(1.08);
  }

  .enter-btn:active {
    transform: scale(0.97);
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 0 24px;
  }

  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 64px;
    letter-spacing: 0.08em;
    margin: 0;
  }

  .wordmark span {
    color: var(--accent);
  }

  .tagline {
    font-size: 14px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 12px 0 0 0;
  }

  /* Menu dropdown */
  .menu-panel {
    position: fixed;
    top: 72px;
    left: 32px;
    background: #1b1e29;
    border: 1px solid var(--border);
    border-radius: 10px;
    min-width: 200px;
    padding: 8px;
    display: none;
    flex-direction: column;
    z-index: 20;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
  }

  .menu-panel.open {
    display: flex;
  }

  .menu-panel a {
    color: var(--text-primary);
    text-decoration: none;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 6px;
    transition: background 0.15s ease;
  }

  .menu-panel a:hover {
    background: rgba(110, 231, 216, 0.08);
    color: var(--accent);
  }

  @media (max-width: 480px) {
    .wordmark { font-size: 44px; }
    header { padding: 18px 20px; }
  }

  /* Ícone flutuante do Instagram */
  .insta-float {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    z-index: 40;
    transition: transform 0.2s ease, filter 0.2s ease;
  }

  .insta-float:hover {
    transform: scale(1.08);
    filter: brightness(1.05);
  }

  .insta-float svg {
    width: 26px;
    height: 26px;
    stroke: #0b1420;
  }
</style>

</head>
<body>

  <header>
    <div style="position: relative;">
      <button class="menu-btn" id="menuToggle" aria-haspopup="true" aria-expanded="false">
        <span class="bars"><span></span><span></span><span></span></span>
      </button>
      <nav class="menu-panel" id="menuPanel">
        <a href="acoes.html">Ações</a>
        <a href="agenda.html">Agenda</a>
        <a href="quemsomos.html">Quem somos?</a>
        <a href="https://forms.gle/GNs9X2bhmA88Agop9" target="_blank" rel="noopener noreferrer">Quero ser um ligante</a>
      </nav>
    </div>
    <a class="enter-btn" href="login.html">Entrar</a>
  </header>

  <main>
    <h1 class="wordmark">LA<span>Me</span>C</h1>
    <p class="tagline">Conhecimento que chega à comunidade</p>
  </main>
  
  <script>
    const toggle = document.getElementById('menuToggle');
    const panel = document.getElementById('menuPanel');

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = panel.classList.toggle('open');
      toggle.setAttribute('aria-expanded', isOpen);
    });

    document.addEventListener('click', () => {
      panel.classList.remove('open');
      toggle.setAttribute('aria-expanded', 'false');
    });
  </script>
  
    <a class="insta-float" href="https://www.instagram.com/lamec.unex" target="_blank" rel="noopener noreferrer" aria-label="Instagram da LAMeC">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
  </a>

</body>
</html>
