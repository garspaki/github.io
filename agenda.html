<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAMeC — Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12141c;
    --bg-glow: #1a1d2b;
    --accent: #6ee7d8;
    --text-primary: #f5f6fa;
    --text-muted: #8a8fa3;
    --border: #2a2e3d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 15%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px;
  }

  .wordmark-small {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.06em;
  }

  .wordmark-small span {
    color: var(--accent);
  }

  .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .logout-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 24px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 32px;
    margin: 0 0 8px 0;
  }

  p {
    color: var(--text-muted);
    font-size: 14px;
  }
</style>
</head>
<body>

  <header>
    <div class="wordmark-small">LA<span>Me</span>C</div>
    <button class="logout-btn" id="logoutBtn">Sair</button>
  </header>

  <main>
    <h1>Agenda</h1>
    <p>Conteúdo da agenda em construção.</p>
  </main>

  <script>
    // Proteção de acesso: se não estiver logado, manda de volta pro login
    // e já indica o retorno para esta página depois de autenticar.
    if (sessionStorage.getItem('lamec_logged_in') !== 'true') {
      window.location.href = 'login.html?redirect=agenda.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      sessionStorage.removeItem('lamec_logged_in');
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
