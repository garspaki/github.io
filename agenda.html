<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAMeC — Agenda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #12141c;
    --bg-glow: #1a1d2b;
    --accent: #6ee7d8;
    --text-primary: #f5f6fa;
    --text-muted: #8a8fa3;
    --border: #2a2e3d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 15%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 32px;
  }

  .wordmark-small {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.06em;
  }

  .wordmark-small span {
    color: var(--accent);
  }

  .logout-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease;
  }

  .logout-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  .page-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 16px;
    flex-wrap: wrap;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px;
    margin: 0;
  }

  .add-btn {
    background: var(--accent);
    border: none;
    color: #0b1420;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
    transition: filter 0.2s ease;
  }

  .add-btn:hover {
    filter: brightness(1.08);
  }

  .event-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .event-card {
    display: flex;
    gap: 16px;
    background: #1b1e29;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    align-items: flex-start;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .event-date {
    flex-shrink: 0;
    width: 56px;
    text-align: center;
    background: rgba(110, 231, 216, 0.08);
    border: 1px solid rgba(110, 231, 216, 0.2);
    border-radius: 8px;
    padding: 8px 0;
  }

  .event-date .day {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .event-date .month {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .event-info {
    flex: 1;
    min-width: 0;
  }

  .event-title {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }

  .event-time {
    font-size: 12px;
    color: var(--accent);
    margin: 0 0 6px 0;
  }

  .event-desc {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0;
    line-height: 1.4;
  }

  .remove-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    padding: 2px 4px;
    flex-shrink: 0;
    transition: color 0.15s ease;
  }

  .remove-btn:hover {
    color: #ff8080;
  }

  .empty-state {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 48px 0;
  }

  /* Modal de novo evento */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    align-items: center;
    justify-content: center;
    z-index: 30;
    padding: 20px;
  }

  .modal-overlay.open {
    display: flex;
  }

  .modal {
    background: #1b1e29;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 380px;
  }

  .modal h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    margin: 0 0 20px 0;
  }

  .modal label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .modal .field-group {
    margin-bottom: 14px;
  }

  .modal input, .modal textarea {
    width: 100%;
    background: #ffffff;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 10px 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: #12141c;
    outline: none;
    resize: none;
  }

  .modal input:focus, .modal textarea:focus {
    box-shadow: 0 0 0 3px rgba(110, 231, 216, 0.35);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .modal-actions button {
    flex: 1;
    padding: 10px 0;
    border-radius: 8px;
    border: none;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  .btn-cancel {
    background: transparent;
    border: 1px solid var(--border) !important;
    color: var(--text-muted);
  }

  .btn-save {
    background: var(--accent);
    color: #0b1420;
  }
</style>
</head>
<body>

  <header>
    <div class="wordmark-small">LA<span>Me</span>C</div>
    <button class="logout-btn" id="logoutBtn">Sair</button>
  </header>

  <main>
    <div class="page-title-row">
      <h1>Sua Agenda</h1>
      <button class="add-btn" id="openModalBtn">+ Novo evento</button>
    </div>

    <div class="event-list" id="eventList"></div>
    <p class="empty-state" id="emptyState" style="display:none;">Nenhum evento por enquanto.</p>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>Novo evento</h2>
      <form id="eventForm">
        <div class="field-group">
          <label for="evTitle">Título</label>
          <input type="text" id="evTitle" required placeholder="Ex: Reunião com equipe">
        </div>
        <div class="field-group">
          <label for="evDate">Data</label>
          <input type="date" id="evDate" required>
        </div>
        <div class="field-group">
          <label for="evTime">Horário</label>
          <input type="time" id="evTime" required>
        </div>
        <div class="field-group">
          <label for="evDesc">Descrição (opcional)</label>
          <textarea id="evDesc" rows="2" placeholder="Detalhes do compromisso"></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelModalBtn">Cancelar</button>
          <button type="submit" class="btn-save">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Conexão com o Supabase (URL do projeto + chave anon public).
    // A chave anon é feita para ficar exposta no front-end, não é secreta.
    const SUPABASE_URL = 'https://yohexasnrxgieanhtkga.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaGV4YXNucnhnaWVhbmh0a2dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMDMxMjQsImV4cCI6MjEwNDU3OTEyNH0.SR6yDP2LIOzee6CXEP6O-cRHG1NVrxr4Qdje4GSp3Bc';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    (async () => {
      // Proteção de acesso: checa se existe uma sessão real do Supabase Auth.
      // Se não tiver, manda de volta pro login com o redirecionamento certo.
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'login.html?redirect=agenda.html';
      }
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = '/';
    });

    const MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];

    function formatDateParts(isoDate) {
      const [year, month, day] = isoDate.split('-').map(Number);
      return { day, month: MESES[month - 1] };
    }

    async function loadEvents() {
      const list = document.getElementById('eventList');
      const empty = document.getElementById('emptyState');

      const { data, error } = await supabaseClient
        .from('eventos')
        .select('*')
        .order('date', { ascending: true })
        .order('time', { ascending: true });

      if (error) {
        list.innerHTML = '';
        empty.style.display = 'block';
        empty.textContent = 'Erro ao carregar eventos: ' + error.message;
        console.error(error);
        return;
      }

      list.innerHTML = '';

      if (!data || data.length === 0) {
        empty.textContent = 'Nenhum evento por enquanto.';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      data.forEach((ev) => {
        const { day, month } = formatDateParts(ev.date);
        const card = document.createElement('div');
        card.className = 'event-card';
        card.innerHTML = `
          <div class="event-date">
            <div class="day">${day}</div>
            <div class="month">${month}</div>
          </div>
          <div class="event-info">
            <p class="event-title">${ev.title}</p>
            <p class="event-time">${ev.time}</p>
            ${ev.desc ? `<p class="event-desc">${ev.desc}</p>` : ''}
          </div>
          <button class="remove-btn" title="Remover evento">✕</button>
        `;
        card.querySelector('.remove-btn').addEventListener('click', () => removeEvent(ev.id));
        list.appendChild(card);
      });
    }

    async function removeEvent(id) {
      const { error } = await supabaseClient.from('eventos').delete().eq('id', id);
      if (error) {
        alert('Erro ao remover evento: ' + error.message);
        console.error(error);
        return;
      }
      loadEvents();
    }

    // Controle do modal de novo evento 1
    const overlay = document.getElementById('modalOverlay');
    document.getElementById('openModalBtn').addEventListener('click', () => overlay.classList.add('open'));
    document.getElementById('cancelModalBtn').addEventListener('click', () => overlay.classList.remove('open'));
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('open');
    });

    document.getElementById('eventForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const { error } = await supabaseClient.from('eventos').insert({
        title: document.getElementById('evTitle').value.trim(),
        date: document.getElementById('evDate').value,
        time: document.getElementById('evTime').value,
        desc: document.getElementById('evDesc').value.trim()
      });

      if (error) {
        alert('Erro ao salvar evento: ' + error.message);
        console.error(error);
        return;
      }

      e.target.reset();
      overlay.classList.remove('open');
      loadEvents();
    });

    loadEvents();
  </script>

</body>
</html>
