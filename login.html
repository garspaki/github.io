<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAMeC — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    :root {
    --bg: #3C7D91;
    --bg-glow: #4C8EA6;
    --panel-white: #ffffff;
    --panel-white-dim: #f2f3f7;
    --accent: #43F1F7;
    --text-primary: #f5f6fa;
    --text-muted: #c3c4c9;
    --border: #2a2e3d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 15%, var(--bg-glow) 0%, var(--bg) 55%);
    color: var(--text-primary);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .card {
    width: 100%;
    max-width: 360px;
    padding: 48px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: rise 0.6s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .wordmark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 42px;
    letter-spacing: 0.08em;
    color: var(--text-primary);
    margin: 0 0 4px 0;
    position: relative;
  }

  .wordmark span {
    color: var(--accent);
  }

  .tagline {
    font-size: 12px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 40px 0;
  }

  form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .field-group {
    position: relative;
  }

  .field-label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
    padding-left: 2px;
  }

  .field {
    width: 100%;
    background: var(--panel-white);
    border: 1px solid transparent;
    border-radius: 10px;
    padding: 14px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: #12141c;
    outline: none;
    transition: box-shadow 0.25s ease, transform 0.15s ease, background 0.25s ease;
    box-shadow: 0 0 0 rgba(110, 231, 216, 0);
  }

  .field::placeholder {
    color: #a3a7b8;
  }

  .field:focus {
    background: var(--panel-white);
    box-shadow: 0 0 0 3px rgba(110, 231, 216, 0.35), 0 8px 24px rgba(110, 231, 216, 0.08);
    transform: translateY(-1px);
  }

  .confirm-btn {
    margin-top: 12px;
    width: 100%;
    padding: 14px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #0b1420;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: filter 0.2s ease, transform 0.15s ease;
  }

  .confirm-btn:hover {
    filter: brightness(1.08);
  }

  .confirm-btn:active {
    transform: scale(0.98);
  }

  .confirm-btn:focus-visible,
  .field:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .hint {
    margin-top: 24px;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
  }

  .hint a {
    color: var(--accent);
    text-decoration: none;
  }

  .hint a:hover {
    text-decoration: underline;
  }

  .auth-warning {
    display: none;
    width: 100%;
    background: rgba(255, 184, 92, 0.1);
    border: 1px solid rgba(255, 184, 92, 0.35);
    color: #ffb85c;
    font-size: 13px;
    line-height: 1.4;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: center;
  }

  .auth-warning.show {
    display: block;
  }

  .auth-error {
    display: none;
    width: 100%;
    background: rgba(255, 92, 92, 0.1);
    border: 1px solid rgba(255, 92, 92, 0.35);
    color: #ff8080;
    font-size: 13px;
    line-height: 1.4;
    padding: 12px 14px;
    border-radius: 8px;
    margin-bottom: 20px;
    text-align: center;
  }

  .auth-error.show {
    display: block;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
    .field, .confirm-btn { transition: none; }
  }

  @media (max-width: 400px) {
    .wordmark { font-size: 36px; }
    .card { padding: 32px 24px; }
  }
</style>
</head>
<body>

  <div class="card">
    <h1 class="wordmark">LA<span>Me</span>C</h1>
    <p class="tagline">Acesse sua conta</p>

    <p class="auth-warning" id="authWarning">Você precisa fazer login para acessar essa página.</p>
    <p class="auth-error" id="authError">Login ou senha incorretos.</p>

    <form id="loginForm">
      <div class="field-group">
        <label class="field-label" for="login">E-mail</label>
        <input class="field" type="email" id="login" name="login" placeholder="Digite seu e-mail" autocomplete="username">
      </div>

      <div class="field-group">
        <label class="field-label" for="senha">Senha</label>
        <input class="field" type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password">
      </div>

      <button class="confirm-btn" type="submit">Confirmar</button>
    </form>

    <p class="hint">Esqueceu a senha? <a href="#">Recuperar acesso</a></p>
  </div>

  <script>
    // Se veio de uma página protegida (ex: login.html?redirect=agenda.html),
    // mostra o aviso e guarda o destino para depois do login.
    const params = new URLSearchParams(window.location.search);
    const redirectTo = params.get('redirect');

    if (redirectTo) {
      document.getElementById('authWarning').classList.add('show');
    }

    // Conexão com o Supabase (mesma URL e chave anon usadas na agenda).
    const SUPABASE_URL = 'https://yohexasnrxgieanhtkga.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlvaGV4YXNucnhnaWVhbmh0a2dhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMDMxMjQsImV4cCI6MjEwNDU3OTEyNH0.SR6yDP2LIOzee6CXEP6O-cRHG1NVrxr4Qdje4GSp3Bc';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('login').value.trim();
      const senha = document.getElementById('senha').value;
      const errorMsg = document.getElementById('authError');
      const submitBtn = e.target.querySelector('.confirm-btn');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password: senha
      });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Confirmar';

      if (error) {
        errorMsg.textContent = 'E-mail ou senha incorretos.';
        errorMsg.classList.add('show');
        return;
      }

      errorMsg.classList.remove('show');
      window.location.href = redirectTo || 'index.html';
    });
  </script>

</body>
</html>
